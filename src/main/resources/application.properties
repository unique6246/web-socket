spring.application.name=web-socket

# Database configuration
# In Docker: DB_HOST=mysql (service name), DB_PORT=3306, DB_NAME=otdb
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:otdb}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Pintu@1617}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.fail-on-empty-beans=false

# JWT Configuration
file.upload-dir=uploads
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:YOUR_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY:YOUR_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:YOUR_API_SECRET}

# JWT Configuration
jwt.secret=${JWT_SECRET:asdfghjklqwertyuiopzxcvbnmrdyhjgdfqwertyuiasdfghjklqwertyuiopzxcvbnmrdyhjgdfqwertyuiasdfghjklqwertyuiopzxcvbnmrdyhjgdfqwertyui}

# Server Configuration
server.port=${SERVER_PORT:8080}

# ?? Server instance identification (used for unique Kafka consumer group IDs) ??
# Set INSTANCE_ID env var to a unique value per server replica (e.g. server-1, server-2)
server.instance.id=${INSTANCE_ID:server-1}

# ?? Apache Kafka ??????????????????????????????????????????????????????????????
# In Docker: KAFKA_HOST=kafka (service name), KAFKA_PORT=9092
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Consumer (shared defaults ? individual group IDs are set per listener factory)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.websocket.kafka

# Unique WebSocket-broadcast consumer group ID for this server instance.
# Each replica must have a different value so ALL servers receive every message.
kafka.ws-broadcast.group-id=ws-broadcast-${INSTANCE_ID:server-1}