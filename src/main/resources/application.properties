spring.application.name=web-socket

# Database configuration
# In Docker: DB_HOST=mysql (service name), DB_PORT=3306, DB_NAME=otdb
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:otdb}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Pintu@1617}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
file.upload-dir=uploads
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:YOUR_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY:YOUR_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:YOUR_API_SECRET}

# JWT Configuration
jwt.secret=${JWT_SECRET:asdfghjklqwertyuiopzxcvbnmrdyhjgdfqwertyuiasdfghjklqwertyuiopzxcvbnmrdyhjgdfqwertyuiasdfghjklqwertyuiopzxcvbnmrdyhjgdfqwertyui}

# Server Configuration
server.port=${SERVER_PORT:8080}

# ?? App settings ??????????????????????????????????????????????????????????????
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.email.enabled=${EMAIL_ENABLED:true}
app.email.from=${EMAIL_FROM:noreply@chatapp.com}

# ?? Server instance identification ???????????????????????????????????????????
server.instance.id=${INSTANCE_ID:server-1}

# ?? Spring Mail (configure SMTP credentials via environment variables) ?????????
# Default config points to MailHog (local dev SMTP catcher ? no auth, no TLS)
# For production/Gmail: set SMTP_HOST, SMTP_PORT, SMTP_AUTH, SMTP_STARTTLS, SMTP_USER, SMTP_PASS
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ?? OAuth2 / SSO ? Google ????????????????????????????????????????????????????
# Register your app at: https://console.cloud.google.com/apis/credentials
# Authorized redirect URI must be: <APP_BASE_URL>/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ?? OAuth2 / SSO ? GitHub ????????????????????????????????????????????????????
# Register your app at: https://github.com/settings/developers
# Authorization callback URL: <APP_BASE_URL>/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:YOUR_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:YOUR_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ?? Redis ????????????????????????????????????????????????????????????????????
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
# Do NOT fail startup if Redis is unavailable (graceful degradation)
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ?? Apache Kafka ??????????????????????????????????????????????????????????????
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Consumer (shared defaults)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.websocket.kafka

# Unique WebSocket-broadcast consumer group ID for this server instance.
# Each replica must have a different value so ALL servers receive every message.
kafka.ws-broadcast.group-id=ws-broadcast-${INSTANCE_ID:server-1}

# ?? Async support (for email sending) ????????????????????????????????????????
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=10