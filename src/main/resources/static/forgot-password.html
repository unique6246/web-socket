<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>Forgot Password – ChatApp</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">🔐</div>
        <h1 class="auth-title">Forgot Password?</h1>
        <p class="auth-sub">No worries! Enter your email and we'll send you a reset link.</p>

        <div id="fpError"   class="error-msg"   style="display:none;"></div>
        <div id="fpSuccess" class="success-msg" style="display:none;"></div>

        <form id="forgotForm" class="auth-form">
            <div class="form-group">
                <label for="resetEmail">Email address</label>
                <input type="email" id="resetEmail" placeholder="you@example.com" required autocomplete="email" maxlength="100">
            </div>
            <button type="submit" class="btn-auth" id="fpBtn">Send Reset Link →</button>
        </form>

        <p class="auth-switch"><a href="/api/v1/login">← Back to sign in</a></p>
    </div>
</div>
<script src="/script.js"></script>
<script>
    document.getElementById("forgotForm")?.addEventListener("submit", async function(e) {
        e.preventDefault();
        const email = document.getElementById("resetEmail").value.trim();
        const errEl = document.getElementById("fpError");
        const okEl  = document.getElementById("fpSuccess");
        const btn   = document.getElementById("fpBtn");
        errEl.style.display = "none"; okEl.style.display = "none";
        if (!email) { errEl.textContent = "Email is required."; errEl.style.display = "block"; return; }
        btn.disabled = true; btn.textContent = "Sending…";
        try {
            const r = await fetch("/api/auth/forgot-password", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ email })
            });
            const d = await r.json();
            if (!r.ok) throw new Error(d.error || "Failed");
            okEl.textContent = d.message;
            okEl.style.display = "block";
            btn.textContent = "Sent ✓";
        } catch(err) {
            errEl.textContent = err.message;
            errEl.style.display = "block";
            btn.disabled = false; btn.textContent = "Send Reset Link →";
        }
    });
</script>
</body>
</html>
