<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://stackpath.bootstrapcdn.com; style-src 'self' 'unsafe-inline' https://stackpath.bootstrapcdn.com; connect-src 'self'; img-src 'self' data:; font-src 'self' https://stackpath.bootstrapcdn.com; object-src 'none'; frame-ancestors 'none';">
  <title>Admin Dashboard – ChatApp</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ── Dashboard dark theme ── */
    body { background:#0d0f17; color:#e8eaf0; font-family:'Inter','Segoe UI',sans-serif; min-height:100vh; display:block; }
    .navbar { background:#0f1119 !important; border-bottom:1px solid rgba(255,255,255,.08); }
    .navbar-brand { font-weight:800; font-size:1.05em; color:#f0f2f8 !important; }
    .container { max-width:none; padding:0 24px; }
    h4, h5 { color:#f0f2f8 !important; }
    hr { border-color:rgba(255,255,255,.08); }
    /* Tables */
    .table { color:#e8eaf0 !important; background:#1a1e2e; border-color:rgba(255,255,255,.08); }
    .table-bordered { border-color:rgba(255,255,255,.08) !important; }
    .table-bordered td,.table-bordered th { border-color:rgba(255,255,255,.08) !important; }
    .table-hover tbody tr:hover { background:#1f2437 !important; color:#fff !important; }
    .thead-dark th { background:#0f1119 !important; color:#9ca3b0 !important; border-color:rgba(255,255,255,.1) !important; }
    /* Form controls */
    .form-control { background:#1a1e2e !important; border-color:rgba(255,255,255,.12) !important; color:#e8eaf0 !important; }
    .form-control:focus { background:#1f2437 !important; border-color:#8b5cf6 !important; box-shadow:0 0 0 3px rgba(124,58,237,.2) !important; color:#fff !important; }
    .form-control::placeholder { color:#5c6375 !important; }
    select.form-control option { background:#1a1e2e; color:#e8eaf0; }
    /* Buttons */
    .btn-primary   { background:#7c3aed !important; border-color:#7c3aed !important; }
    .btn-primary:hover { background:#8b5cf6 !important; border-color:#8b5cf6 !important; }
    .btn-success   { background:#10b981 !important; border-color:#10b981 !important; }
    .btn-success:hover { background:#059669 !important; border-color:#059669 !important; }
    .btn-danger    { background:#f43f5e !important; border-color:#f43f5e !important; }
    .btn-warning   { background:#f59e0b !important; border-color:#f59e0b !important; color:#000 !important; }
    .btn-outline-light { border-color:rgba(255,255,255,.25) !important; color:#e8eaf0 !important; }
    .btn-outline-light:hover { background:rgba(255,255,255,.1) !important; }
    .btn-outline-warning { border-color:#f59e0b !important; color:#f59e0b !important; }
    .btn-outline-warning:hover { background:rgba(245,158,11,.15) !important; }
    /* Alerts */
    .alert-danger  { background:rgba(244,63,94,.1) !important; border-color:rgba(244,63,94,.25) !important; color:#fda4af !important; }
    .alert-success { background:rgba(16,185,129,.1) !important; border-color:rgba(16,185,129,.25) !important; color:#6ee7b7 !important; }
    /* Tabs */
    .nav-tabs { border-color:rgba(255,255,255,.1) !important; }
    .nav-tabs .nav-link { color:#9ca3b0 !important; border-color:transparent !important; }
    .nav-tabs .nav-link:hover { color:#e8eaf0 !important; border-color:rgba(255,255,255,.1) rgba(255,255,255,.1) transparent !important; background:rgba(255,255,255,.04) !important; }
    .nav-tabs .nav-link.active { background:#1a1e2e !important; border-color:rgba(255,255,255,.12) rgba(255,255,255,.12) #1a1e2e !important; color:#8b5cf6 !important; }
    .tab-content { background:#1a1e2e; border:1px solid rgba(255,255,255,.08); border-top:none; border-radius:0 0 8px 8px; padding:20px; }
    /* Modals */
    .modal-content { background:#1a1e2e !important; border:1px solid rgba(255,255,255,.12) !important; color:#e8eaf0 !important; }
    .modal-header { border-color:rgba(255,255,255,.08) !important; }
    .modal-footer { border-color:rgba(255,255,255,.08) !important; }
    .modal-title { color:#f0f2f8 !important; }
    .close { color:#9ca3b0 !important; text-shadow:none !important; }
    /* Stat cards override */
    .stat-card { background:#1a1e2e !important; border:1px solid rgba(255,255,255,.1) !important; border-radius:12px; }
    .stat-card h3 { color:#8b5cf6 !important; font-weight:800; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark px-3">
  <span class="navbar-brand">🛡 Admin Dashboard</span>
  <div class="d-flex align-items-center" style="gap:10px;">
    <span id="navUsername" style="font-size:.9em;opacity:.7;color:#9ca3b0;"></span>
    <a href="/api/v1/kafka-monitor" class="btn btn-outline-warning btn-sm">📡 Kafka Monitor</a>
    <a href="/api/v1/chat" class="btn btn-outline-light btn-sm">← Chat</a>
    <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div id="globalError" class="alert alert-danger mx-3 mt-2" style="display:none;"></div>

<div class="container mt-4">

  <!-- Statistics Section -->
  <section class="mb-4">
    <h4>📊 Statistics</h4>
    <div class="row" id="statsRow">
      <div class="col-md-4"><div class="stat-card"><h3 id="statUsers">–</h3><p>Total Users</p></div></div>
      <div class="col-md-4"><div class="stat-card"><h3 id="statRooms">–</h3><p>Total Chat Rooms</p></div></div>
      <div class="col-md-4"><div class="stat-card"><h3 id="statMessages">–</h3><p>Total Messages</p></div></div>
    </div>
  </section>

  <hr>

  <!-- User Management Section -->
  <section class="mb-4">
    <h4>👤 Manage Users</h4>
    <button class="btn btn-primary btn-sm mb-2" onclick="fetchUsers()">🔄 Refresh Users</button>
    <table class="table table-bordered table-hover table-sm" id="usersTable">
      <thead class="thead-dark">
        <tr><th>ID</th><th>Username</th><th>Email</th><th>Roles</th><th>Actions</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h5 class="mt-3">Add New User</h5>
    <form onsubmit="createUser(event)" class="form-inline">
      <input type="text"     id="newUserName"     class="form-control mr-2 mb-2" placeholder="Username"  required>
      <input type="email"    id="newUserEmail"    class="form-control mr-2 mb-2" placeholder="Email"     required>
      <input type="password" id="newUserPassword" class="form-control mr-2 mb-2" placeholder="Password"  required>
      <select id="newUserRole" class="form-control mr-2 mb-2">
        <option value="USER">USER</option>
        <option value="MODERATOR">MODERATOR</option>
        <option value="ADMIN">ADMIN</option>
      </select>
      <button type="submit" class="btn btn-success mb-2">Add User</button>
    </form>
  </section>

  <hr>

  <!-- Chat Room Management Section -->
  <section class="mb-4">
    <h4>💬 Manage Chat Rooms</h4>
    <button class="btn btn-primary btn-sm mb-2" onclick="fetchChatRooms()">🔄 Refresh Rooms</button>
    <table class="table table-bordered table-hover table-sm" id="chatRoomsTable">
      <thead class="thead-dark">
        <tr><th>ID</th><th>Room Name</th><th>Members</th><th>Actions</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h5 class="mt-3">Create New Chat Room</h5>
    <form onsubmit="createChatRoom(event)" class="form-inline">
      <input type="text" id="newChatRoomName" class="form-control mr-2 mb-2" placeholder="Room Name" required>
      <button type="submit" class="btn btn-success mb-2">Create Room</button>
    </form>
  </section>

</div>

<script>
  // ── Server-side Admin Guard ──────────────────
  // Uses HttpOnly cookie — no token in JS anywhere.
  (async function guardDashboard() {
    try {
      const res = await fetch("/api/auth/me", { credentials: "include" });
      if (!res.ok) {
        // 401 = not logged in — redirect to login
        sessionStorage.clear();
        window.location.href = "/api/v1/login";
        return;
      }
      const data = await res.json();
      const roles = data.roles || [];

      // Persist full profile info
      sessionStorage.setItem("roles",       JSON.stringify(roles));
      sessionStorage.setItem("username",    data.username);
      sessionStorage.setItem("displayName", data.displayName || data.username);
      sessionStorage.setItem("avatarUrl",   data.avatarUrl   || "");

      if (!roles.includes("ROLE_ADMIN")) {
        // Logged in but not admin — show access-denied, don't loop to login
        document.body.innerHTML =
          `<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;font-family:sans-serif;gap:16px;">
             <h2>&#x26D4; Access Denied</h2>
             <p>You need the <strong>ADMIN</strong> role to view this page.</p>
             <a href="/api/v1/chat" style="color:#4f46e5;">&#8592; Back to Chat</a>
           </div>`;
        return;
      }

      // Show the logged-in username in the navbar
      const navUser = document.getElementById("navUsername");
      if (navUser) navUser.textContent = data.displayName || data.username;

      // Boot the dashboard
      if (document.readyState !== "loading") {
        fetchStats(); fetchUsers(); fetchChatRooms();
      } else {
        document.addEventListener("DOMContentLoaded", () => {
          fetchStats(); fetchUsers(); fetchChatRooms();
        });
      }
    } catch (e) {
      sessionStorage.clear();
      window.location.href = "/api/v1/login";
    }
  })();

  const baseUrl = "/admin";

  function logout() {
    // POST to server — HttpOnly cookie is sent automatically, server blacklists it and clears cookie
    fetch("/api/auth/logout", { method: "POST", credentials: "include" })
      .finally(() => {
        sessionStorage.removeItem("username");
        sessionStorage.removeItem("roles");
        window.location.href = "/api/v1/login";
      });
  }

  async function authFetch(url, options = {}) {
    options.credentials = "include";
    options.headers = { ...options.headers, "Content-Type": "application/json" };
    const res = await fetch(url, options);
    if (res.status === 401) {
      // Session expired — go to login
      sessionStorage.clear();
      window.location.href = "/api/v1/login";
      return null;
    }
    if (res.status === 403) {
      // Authenticated but not authorized — show error inline, don't redirect
      const errBox = document.getElementById("globalError");
      if (errBox) { errBox.textContent = "⛔ Permission denied for: " + url; errBox.style.display = "block"; }
      else alert("Access denied: " + url);
      return null;
    }
    return res;
  }

  // ── XSS-safe escaper for use in the dashboard ──
  function esc(str) {
    if (str == null) return "";
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ── Stats ──────────────────────────────────
  async function fetchStats() {
    const res = await authFetch(`${baseUrl}/stats`);
    if (!res) return;
    const data = await res.json();
    document.getElementById("statUsers").textContent    = data.totalUsers    ?? "–";
    document.getElementById("statRooms").textContent    = data.totalChatRooms ?? "–";
    document.getElementById("statMessages").textContent = data.totalMessages  ?? "–";
  }

  // ── Users ──────────────────────────────────
  async function fetchUsers() {
    const res = await authFetch(`${baseUrl}/users`);
    if (!res) return;
    const users = await res.json();
    const tbody = document.querySelector("#usersTable tbody");
    tbody.innerHTML = "";
    users.forEach(user => {
      const roleBadges = (user.roles || []).map(r =>
        `<span class="badge-${esc(r.name.toLowerCase())}">${esc(r.name)}</span>`
      ).join(" ");
      tbody.insertAdjacentHTML("beforeend", `
        <tr>
          <td>${esc(user.id)}</td>
          <td>${esc(user.username)}</td>
          <td>${user.email ? `<a href="mailto:${esc(user.email)}">${esc(user.email)}</a>` : '<span class="text-muted">—</span>'}</td>
          <td>${roleBadges}</td>
          <td>
            <select id="roleSelect_${esc(user.id)}" class="form-control form-control-sm d-inline" style="width:130px">
              <option value="USER">USER</option>
              <option value="MODERATOR">MODERATOR</option>
              <option value="ADMIN">ADMIN</option>
            </select>
            <button class="btn btn-success btn-sm" onclick="assignRole('${esc(user.username)}', '${esc(user.id)}')">+Role</button>
            <button class="btn btn-warning btn-sm" onclick="removeRole('${esc(user.username)}', '${esc(user.id)}')">-Role</button>
            <button class="btn btn-danger btn-sm" onclick="deleteUser(${esc(user.id)})">Delete</button>
          </td>
        </tr>`);
    });
  }

  async function createUser(event) {
    event.preventDefault();
    const username  = document.getElementById("newUserName").value.trim();
    const email     = document.getElementById("newUserEmail").value.trim();
    const password  = document.getElementById("newUserPassword").value;
    const roleToSet = document.getElementById("newUserRole").value;

    if (!email) { alert("Email is required."); return; }

    // Register user (gets USER role by default)
    const res = await authFetch(`${baseUrl}/users`, {
      method: "POST",
      body: JSON.stringify({ username, email, password })
    });
    if (!res) return;
    if (res.ok) {
      // If not USER role, also assign the selected role
      if (roleToSet !== "USER") {
        await authFetch(`${baseUrl}/users/${username}/roles/assign`, {
          method: "PUT",
          body: JSON.stringify({ role: roleToSet })
        });
      }
      alert("User created successfully!");
      document.getElementById("newUserName").value = "";
      document.getElementById("newUserEmail").value = "";
      document.getElementById("newUserPassword").value = "";
      fetchUsers();
    } else {
      const msg = await res.text();
      alert("Error creating user: " + msg);
    }
  }

  async function deleteUser(id) {
    if (!confirm("Delete this user?")) return;
    await authFetch(`${baseUrl}/users/${id}`, { method: "DELETE" });
    fetchUsers();
  }

  async function assignRole(username, userId) {
    const role = document.getElementById(`roleSelect_${userId}`).value;
    const res = await authFetch(`${baseUrl}/users/${username}/roles/assign`, {
      method: "PUT",
      body: JSON.stringify({ role })
    });
    if (res && res.ok) { alert(`Role ${role} assigned!`); fetchUsers(); }
    else alert("Failed to assign role.");
  }

  async function removeRole(username, userId) {
    const role = document.getElementById(`roleSelect_${userId}`).value;
    const res = await authFetch(`${baseUrl}/users/${username}/roles/remove`, {
      method: "PUT",
      body: JSON.stringify({ role })
    });
    if (res && res.ok) { alert(`Role ${role} removed!`); fetchUsers(); }
    else alert("Failed to remove role.");
  }

  // ── Chat Rooms ─────────────────────────────
  async function fetchChatRooms() {
    const res = await authFetch(`${baseUrl}/chatrooms`);
    if (!res) return;
    const rooms = await res.json();
    const tbody = document.querySelector("#chatRoomsTable tbody");
    tbody.innerHTML = "";
    rooms.forEach(room => {
      const memberCount = room.memberCount ?? "–";
      tbody.insertAdjacentHTML("beforeend", `
        <tr>
          <td>${esc(room.id)}</td>
          <td>${esc(room.roomName)}</td>
          <td>${esc(memberCount)}</td>
          <td>
            <button class="btn btn-danger btn-sm" onclick="deleteChatRoom(${esc(room.id)})">Delete</button>
          </td>
        </tr>`);
    });
  }

  async function createChatRoom(event) {
    event.preventDefault();
    const roomName = document.getElementById("newChatRoomName").value;
    const res = await authFetch(`${baseUrl}/chatrooms`, {
      method: "POST",
      body: JSON.stringify({ roomName })
    });
    if (res && res.ok) {
      alert("Chat room created!");
      document.getElementById("newChatRoomName").value = "";
      fetchChatRooms();
    } else {
      alert("Error creating chat room.");
    }
  }

  async function deleteChatRoom(id) {
    if (!confirm("Delete this chat room?")) return;
    await authFetch(`${baseUrl}/chatrooms/${id}`, { method: "DELETE" });
    fetchChatRooms();
  }

  // ── Init is handled in the guard above ──
</script>
</body>
</html>
