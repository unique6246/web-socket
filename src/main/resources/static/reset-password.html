<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <title>Reset Password – ChatApp</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">🔑</div>
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-sub">Choose a strong new password for your account</p>

        <div id="rpError"   class="error-msg"   style="display:none;"></div>
        <div id="rpSuccess" class="success-msg" style="display:none;"></div>

        <form id="resetForm" class="auth-form">
            <div class="form-group">
                <label for="newPwd">New Password <span class="req">*</span></label>
                <div class="pw-wrap">
                    <input type="password" id="newPwd" placeholder="Min 8 chars, uppercase, digit, symbol" required autocomplete="new-password" maxlength="128">
                    <button type="button" class="pw-toggle" onclick="togglePw('newPwd', this)" tabindex="-1">👁</button>
                </div>
                <div class="pw-strength-bar"><div id="pwFill" class="pw-strength-fill"></div></div>
            </div>
            <div class="form-group">
                <label for="confirmPwd">Confirm Password <span class="req">*</span></label>
                <div class="pw-wrap">
                    <input type="password" id="confirmPwd" placeholder="Repeat password" required autocomplete="new-password" maxlength="128">
                    <button type="button" class="pw-toggle" onclick="togglePw('confirmPwd', this)" tabindex="-1">👁</button>
                </div>
            </div>
            <button type="submit" class="btn-auth" id="rpBtn">Reset Password →</button>
        </form>

        <p class="auth-switch"><a href="/api/v1/login">← Back to sign in</a></p>
    </div>
</div>
<script src="/script.js"></script>
<script>
    const token = new URLSearchParams(window.location.search).get("token");
    if (!token) {
        document.getElementById("rpError").textContent = "Invalid or missing reset token. Please request a new link.";
        document.getElementById("rpError").style.display = "block";
        document.getElementById("resetForm").style.display = "none";
    }

    document.getElementById("newPwd")?.addEventListener("input", function() {
        const fill = document.getElementById("pwFill");
        const v = this.value;
        let score = [v.length>=8, /[A-Z]/.test(v), /[a-z]/.test(v), /\d/.test(v), /[^a-zA-Z0-9]/.test(v)].filter(Boolean).length;
        const colors = ["","#f43f5e","#f97316","#eab308","#10b981","#059669"];
        fill.style.width = (score/5*100) + "%";
        fill.style.background = colors[score] || "#1f2437";
    });

    document.getElementById("resetForm")?.addEventListener("submit", async function(e) {
        e.preventDefault();
        const password = document.getElementById("newPwd").value;
        const confirm  = document.getElementById("confirmPwd").value;
        const errEl = document.getElementById("rpError");
        const okEl  = document.getElementById("rpSuccess");
        const btn   = document.getElementById("rpBtn");
        errEl.style.display = "none"; okEl.style.display = "none";

        if (password.length < 8) { errEl.textContent = "Password must be at least 8 characters."; errEl.style.display = "block"; return; }
        if (password.length > 128) { errEl.textContent = "Password must not exceed 128 characters."; errEl.style.display = "block"; return; }
        if (!/[A-Z]/.test(password)) { errEl.textContent = "Password must contain at least one uppercase letter."; errEl.style.display = "block"; return; }
        if (!/[a-z]/.test(password)) { errEl.textContent = "Password must contain at least one lowercase letter."; errEl.style.display = "block"; return; }
        if (!/\d/.test(password)) { errEl.textContent = "Password must contain at least one digit."; errEl.style.display = "block"; return; }
        if (!/[!@#$%^&*()\-_=+\[\]{};':"\\|,.<>\/?`~]/.test(password)) { errEl.textContent = "Password must contain at least one special character."; errEl.style.display = "block"; return; }
        if (password !== confirm) { errEl.textContent = "Passwords do not match."; errEl.style.display = "block"; return; }

        btn.disabled = true; btn.textContent = "Resetting…";
        try {
            const r = await fetch("/api/auth/reset-password", {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ token, password })
            });
            const d = await r.json();
            if (!r.ok) throw new Error(d.error || "Failed");
            okEl.textContent = d.message + " Redirecting to login…";
            okEl.style.display = "block";
            document.getElementById("resetForm").style.display = "none";
            setTimeout(() => window.location.href = "/api/v1/login", 2000);
        } catch(err) {
            errEl.textContent = err.message;
            errEl.style.display = "block";
            btn.disabled = false; btn.textContent = "Reset Password →";
        }
    });
</script>
</body>
</html>
