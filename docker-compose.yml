# ═══════════════════════════════════════════════════════════════
#  ChatApp – Docker Compose
#  Services:  app  |  mysql  |  zookeeper  |  kafka  |  kafka-ui
#  Cloudinary is external (cloud) — no container needed.
#
#  Architecture (per the Kafka + WebSocket design):
#    User → app → Kafka → app (fan-out via ws-broadcast consumer)
#    Kafka also feeds:  chat-persistence (DB write)
#                       push-notifications (stub)
#
#  Usage:
#    docker compose up --build        # first time
#    docker compose up -d             # detached
#    docker compose down              # stop & remove containers
#    docker compose down -v           # also remove volumes (wipes DB + Kafka)
# ═══════════════════════════════════════════════════════════════

services:

  # ── Zookeeper (required by Kafka) ─────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: chatapp-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - chatapp-net

  # ── Kafka Broker ──────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: chatapp-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"           # expose for local Kafka tools / testing
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - chatapp-net

  # ── MySQL ────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: chatapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USERNAME}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    ports:
      - "3306:3306"           # expose for local tools (DBeaver, MySQL Workbench)
    volumes:
      - mysql_data:/var/lib/mysql   # persist database across restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - chatapp-net

  # ── Kafka UI (Provectus) ──────────────────────────────────────
  # Web dashboard to monitor topics, messages, partitions,
  # consumer groups and offsets.
  # Access at: http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: chatapp-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME:            local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER:       zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - chatapp-net

  # ── Spring Boot App — Server Instance 1 ───────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp-app
    restart: unless-stopped
    ports:
      - "8085:8080"           # host:container — change 8085 if already in use
    env_file:
      - .env                  # load all variables from .env
    environment:
      DB_HOST:    mysql
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      INSTANCE_ID: server-1
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - chatapp-net

# ── Volumes ───────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
  kafka_data:
    driver: local

# ── Network ───────────────────────────────────────────────────
networks:
  chatapp-net:
    driver: bridge
